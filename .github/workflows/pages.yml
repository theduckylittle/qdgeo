name: Examples

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, write an OIDC token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queue rather than cancel, so a run that is already
# publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build the WASM module
        run: zig build wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json

      - name: Build the site
        run: |
          # The demos import `qdgeo` by name and fetch ./qdgeo.wasm, so the
          # freshly built module goes into Vite's public directory first.
          mkdir -p examples/public
          cp zig-out/bin/qdgeo.wasm examples/public/qdgeo.wasm
          npm --prefix examples ci
          npm run examples:build
          mv examples/dist site

      - name: Check the pages the site will serve
        run: |
          for page in index canvas openlayers maplibre deckgl; do
            test -s "site/$page.html" || { echo "missing site/$page.html"; exit 1; }
          done
          test -s site/qdgeo.wasm
          echo "site is complete"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
