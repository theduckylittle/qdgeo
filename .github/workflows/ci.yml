name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig unit tests
        run: zig build test

      - name: Zig unit tests, ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build every target
        run: |
          zig build
          zig build native -Doptimize=ReleaseSafe
          zig build wasm
          zig build run

      - name: Report artifact size
        run: |
          raw=$(stat -c%s zig-out/bin/qdgeo.wasm)
          gz=$(gzip -9 -c zig-out/bin/qdgeo.wasm | wc -c)
          echo "WASM: $raw bytes raw, $gz gzipped"
          echo "### WASM artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$raw\` bytes raw, \`$gz\` gzipped" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json

      - run: npm ci

      # The deck.gl and Leaflet adapter tests run against the real libraries,
      # which live in the examples' dependencies, so they are installed before
      # the suite rather than after it. Without them those two files would skip,
      # and `tests/deck.test.mjs` fails outright rather than skipping under CI.
      - run: npm --prefix examples ci

      - name: Tests
        # vitest: the ABI, the binding, both adapters, and the JTS suite.
        # `pretest` runs `zig build wasm`, which is already cached by now.
        run: npm test

      - name: Build the examples
        run: |
          # The demos call `load()` with no argument, so Vite follows the
          # binding's own `new URL('./qdgeo.wasm', import.meta.url)` and emits
          # the module as a hashed asset. `zig build wasm` above put it beside
          # the binding; nothing is copied into place here.
          npm run examples:build
          for page in index canvas openlayers maplibre leaflet deckgl; do
            test -s "examples/dist/$page.html" || { echo "missing $page.html"; exit 1; }
          done
          ls examples/dist/assets/*.wasm >/dev/null || {
            echo "the WASM module was not emitted as an asset"; exit 1; }

      - name: Declaration types
        run: |
          # Generated from the JSDoc, so this fails when the two disagree.
          npm run types
          test -s types/qdgeo.d.ts

      - name: Package manifest
        run: |
          # Every file the `exports` map promises has to be in the tarball.
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [{ files }] = require("/tmp/pack.json");
            const names = new Set(files.map((f) => f.path));
            const pkg = require("./package.json");
            const targets = (map) =>
              Object.values(map ?? {}).flatMap((e) =>
                typeof e === "string" ? [e] : Object.values(e),
              );
            // `imports` too: `#fs` resolves to a different file per condition,
            // and both have to be in the tarball.
            const wanted = [...targets(pkg.exports), ...targets(pkg.imports)];
            const missing = wanted.filter((p) => !names.has(p.replace(/^\.\//, "")));
            if (missing.length) {
              console.error("not in the package:", missing.join(", "));
              process.exit(1);
            }
            console.log(`packed ${files.length} files; every entry point resolves`);
          '

      - name: Formatting
        run: npm run format:check

      - name: Zig formatting
        run: zig fmt --check build.zig src
