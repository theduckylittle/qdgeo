<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas example</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --panel: #fff;
    --ink: #1b1a18;
    --muted: #6b6862;
    --line: #ddd9d2;
    --accent: #2f6f4f;
    --a: #3b6ea5;
    --b: #b5651d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1e2024;
      --ink: #e8e6e1;
      --muted: #9b978f;
      --line: #32353b;
      --accent: #6fbb92;
      --a: #7aa9d8;
      --b: #d99a5f;
    }
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font:
      15px/1.5 ui-sans-serif,
      system-ui,
      -apple-system,
      'Segoe UI',
      Roboto,
      sans-serif;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  p.lede {
    margin: 0 0 20px;
    color: var(--muted);
    max-width: 60ch;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .controls {
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    margin-bottom: 14px;
  }
  fieldset {
    border: 0;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  legend {
    float: left;
    margin-right: 10px;
    padding: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  label.op {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9rem;
  }
  input[type='range'] {
    width: 190px;
    vertical-align: middle;
    accent-color: var(--accent);
  }
  select {
    font: inherit;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    touch-action: none;
  }
  .out {
    margin-top: 12px;
    padding: 10px 14px;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .out b {
    color: var(--ink);
    font-weight: 600;
  }
  .err {
    color: #c0392b;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85em;
  }
  .key {
    display: flex;
    gap: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .key i {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }
</style>

<div class="wrap">
  <h1>Plain canvas</h1>
  <p class="lede">
    No mapping library, no projection — just two shapes, the WASM module, and
    <code>&lt;canvas&gt;</code>. Drag either shape to see the result update.
  </p>

  <div class="panel controls">
    <fieldset>
      <legend>Operation</legend>
      <label class="op"><input type="radio" name="op" value="union" checked /> Union</label>
      <label class="op"><input type="radio" name="op" value="intersection" /> Intersection</label>
      <label class="op"><input type="radio" name="op" value="difference" /> Difference</label>
      <label class="op"
        ><input type="radio" name="op" value="symmetricDifference" /> Symmetric difference</label
      >
      <label class="op"><input type="radio" name="op" value="buffer" /> Buffer</label>
    </fieldset>
    <fieldset>
      <legend>Shapes</legend>
      <select id="shapes">
        <option value="star">Star and square</option>
        <option value="hex">Two hexagons</option>
        <option value="donut">Ring and bar</option>
      </select>
    </fieldset>
    <fieldset id="distance-group">
      <legend>Distance</legend>
      <input type="range" id="distance" min="-40" max="60" value="18" step="1" />
      <span id="distance-value" style="min-width: 4ch">18</span>
    </fieldset>
  </div>

  <div class="panel"><canvas id="c" width="960" height="520"></canvas></div>
  <div class="key">
    <span><i style="background: var(--a)"></i>First shape</span>
    <span><i style="background: var(--b)"></i>Second shape</span>
    <span><i style="background: var(--accent)"></i>Result</span>
  </div>
  <div class="panel out" id="out">Loading…</div>
</div>

<script type="module">
  import { load, OP, regular, star, close } from './lib/geometry.js';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const out = document.getElementById('out');
  const css = getComputedStyle(document.documentElement);

  // Two operands. Each is a list of rings; ring 0 is the shell, the rest holes.
  const sets = {
    star: () => [
      [star(330, 260, 150, 62)],
      [
        close([
          [430, 170],
          [720, 170],
          [720, 360],
          [430, 360],
        ]),
      ],
    ],
    hex: () => [[regular(360, 260, 150, 6)], [regular(560, 260, 150, 6, Math.PI / 6)]],
    donut: () => [
      [regular(400, 260, 165, 40), regular(400, 260, 85, 40).slice().reverse()],
      [
        close([
          [300, 225],
          [760, 225],
          [760, 295],
          [300, 295],
        ]),
      ],
    ],
  };

  let geo,
    shapes = sets.star(),
    offsets = [
      [0, 0],
      [0, 0],
    ],
    dragging = -1,
    last = [0, 0];

  const shifted = (i) =>
    shapes[i].map((ring) => ring.map(([x, y]) => [x + offsets[i][0], y + offsets[i][1]]));
  const op = () => document.querySelector('input[name=op]:checked').value;

  function ringPath(ring) {
    ctx.beginPath();
    ring.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
  }

  // One path per polygon, so holes are cut by the even-odd fill rule.
  function polygonPath(polygon) {
    ctx.beginPath();
    for (const ring of polygon) {
      ring.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
    }
  }

  function draw() {
    const a = shifted(0),
      b = shifted(1);
    const buffering = op() === 'buffer';
    const distance = Number(document.getElementById('distance').value);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let result = [],
      note = '';
    try {
      // Buffer takes every polygon at once; the boolean ops split them into two
      // operands, and `subject` says how many leading polygons form the first.
      const input = { polygons: buffering ? [a] : [a, b] };
      result = geo.run(input, OP[op()], { subject: 1, distance, steps: 16 });
    } catch (error) {
      note = `<span class="err">${error.message}</span>`;
    }

    for (const [polygon, colour] of [
      [a, css.getPropertyValue('--a')],
      ...(buffering ? [] : [[b, css.getPropertyValue('--b')]]),
    ]) {
      polygonPath(polygon);
      ctx.fillStyle = colour.trim() + '22';
      ctx.fill('evenodd');
      ctx.strokeStyle = colour.trim();
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    const accent = css.getPropertyValue('--accent').trim();
    for (const polygon of result) {
      polygonPath(polygon);
      ctx.fillStyle = accent + '3a';
      ctx.fill('evenodd');
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    const rings = result.reduce((n, p) => n + p.length, 0);
    const points = result.reduce((n, p) => n + p.reduce((m, r) => m + r.length, 0), 0);
    out.innerHTML =
      note ||
      `<b>${result.length}</b> polygon${result.length === 1 ? '' : 's'}, ` +
        `<b>${rings}</b> ring${rings === 1 ? '' : 's'}, <b>${points}</b> coordinates.` +
        (buffering ? ` Distance <b>${distance}</b>${distance < 0 ? ' (shrinking)' : ''}.` : '');
  }

  // Dragging: pick whichever shell contains the pointer, topmost first.
  const at = (event) => {
    const box = canvas.getBoundingClientRect();
    return [
      (event.clientX - box.left) * (canvas.width / box.width),
      (event.clientY - box.top) * (canvas.height / box.height),
    ];
  };
  canvas.addEventListener('pointerdown', (event) => {
    const p = at(event);
    for (let i = shapes.length - 1; i >= 0; i--) {
      ringPath(shifted(i)[0]);
      if (ctx.isPointInPath(p[0], p[1])) {
        dragging = i;
        last = p;
        canvas.setPointerCapture(event.pointerId);
        return;
      }
    }
  });
  canvas.addEventListener('pointermove', (event) => {
    if (dragging < 0) return;
    const p = at(event);
    offsets[dragging][0] += p[0] - last[0];
    offsets[dragging][1] += p[1] - last[1];
    last = p;
    draw();
  });
  const stop = () => {
    dragging = -1;
  };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  document.getElementById('shapes').addEventListener('change', (event) => {
    shapes = sets[event.target.value]();
    offsets = [
      [0, 0],
      [0, 0],
    ];
    draw();
  });
  document.getElementById('distance').addEventListener('input', (event) => {
    document.getElementById('distance-value').textContent = event.target.value;
    draw();
  });
  for (const radio of document.querySelectorAll('input[name=op]')) {
    radio.addEventListener('change', () => {
      document.getElementById('distance-group').style.opacity = op() === 'buffer' ? '1' : '.4';
      draw();
    });
  }

  geo = await load('./vendor/qdgeo.wasm');
  document.getElementById('distance-group').style.opacity = '.4';
  draw();
</script>
