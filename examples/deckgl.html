<div class="wrap">
  <h1>deck.gl</h1>
  <p class="lede">
    <a href="https://deck.gl/">deck.gl</a> draws large datasets on the GPU. qdgeo returns flat typed
    arrays, so a result reaches a layer without any coordinate being read or copied —
    <code>qdgeo/deck</code> is that conversion, and it ships with the library. The shapes are metre
    offsets, so a buffer distance is metres on the ground.
  </p>

  <div id="root"></div>
</div>
